name: Continuous integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source, build, and behavior
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build the Worker
        run: npm run build

      - name: Run the full test suite
        run: npm test

      - name: Test the built Worker
        run: npm run test:rendered

      - name: Check generated diff cleanliness
        run: git diff --check
